<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Three.js Scene</title>
    <script src="https://openprocessing.org/openprocessing_sketch.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.139.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.139.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.139.0/examples/js/loaders/GLTFLoader.js"></script>
    <link rel="stylesheet" type="text/css" href="./main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0; /* Reset default body margin */
            overflow: hidden; /* Prevent scrollbars */
        }
        #threeCanvas {
            display: block; /* Removes extra space below canvas */
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-black">
    <canvas id="threeCanvas"></canvas>
    <script src="script.js" type="module"></script>
    
    <!-- Post-processing libraries for EffectComposer -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    
    <!-- Shader definitions. We will use these for our custom pixelation effect. -->
    <script type="x-shader/x-vertex" id="pixel-vertex-shader">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
        }
    </script>
    
    <script type="x-shader/x-fragment" id="pixel-fragment-shader">
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float pixelSize;
        varying vec2 vUv;
        
        void main() {
            // Get the screen resolution
            vec2 iResolution = vec2(textureSize(tDiffuse, 0));
            
            // Quantize UV coordinates to create the pixel grid
            vec2 uv = floor(vUv * iResolution / pixelSize) * pixelSize / iResolution;
            
            // Sample the texture at the new, pixelated UV coordinates
            gl_FragColor = texture2D(tDiffuse, uv);
        }
    </script>
</body>
</html>

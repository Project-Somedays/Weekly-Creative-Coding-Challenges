<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Three.js Scene</title>
    <script src="https://openprocessing.org/openprocessing_sketch.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.139.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.139.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.139.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.139.0/examples/js/loaders/TextureLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.umd.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0; /* Reset default body margin */
            overflow: hidden; /* Prevent scrollbars */
        }
        #threeCanvas {
            display: block; /* Removes extra space below canvas */
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-black">
    <canvas id="threeCanvas"></canvas>
    <div id="canvasContainer" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: white; border: 2px solid #333; padding: 0;">
        <canvas id="drawingCanvas" style="display: block;"></canvas>
        <canvas id="cursorCanvas" style="position: absolute; top: 0; left: 0; pointer-events: none; display: block;"></canvas>
    </div>
    <script src="drawTools.js"></script>
    <script src="leafbiz.js"></script>

    <script src="script.js"></script>
    
    
</body>
</html>
